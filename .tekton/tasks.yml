
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the shared workspace before the pipeline starts.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.19
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace..."
        find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        echo "Cleanup completed."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run Python unit tests using Nose.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments passed to nosetests.
      type: string
      default: "-v"
  steps:
    - name: run-unit-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eu
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        nosetests $(params.args)
